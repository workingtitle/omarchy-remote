<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omarchy Remote</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<!-- The start page without the browser client (backend/config.mjs browserClient): this machine is reached with the apps. -->
<style>
  body { background: var(--bg); color: var(--fg); overflow: auto; height: auto; min-height: 100dvh; }
  main { max-width: 26rem; margin: 14vh auto 0; padding: 0 20px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--fg-2); line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Omarchy Remote is running</h1>
  <p>Use this machine from the Omarchy Remote app on your iPhone, iPad or Mac. To pair a device, click the Omarchy Remote icon in the machine's bar.</p>
</main>
</body>
</html>
